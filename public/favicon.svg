<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1510"/>
      <stop offset="50%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#1a1205"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c8860a"/>
      <stop offset="30%" stop-color="#f5a623"/>
      <stop offset="60%" stop-color="#e8920f"/>
      <stop offset="100%" stop-color="#a06008"/>
    </linearGradient>
    <linearGradient id="scbGrad" x1="0" y1="320" x2="0" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#E07B00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="borderGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer glow border -->
  <rect x="8" y="8" width="1008" height="1008" rx="200" ry="200" fill="none" stroke="#c8860a" stroke-width="6" opacity="0.4" filter="url(#borderGlow)"/>

  <!-- Background -->
  <rect x="0" y="0" width="1024" height="1024" rx="196" ry="196" fill="url(#bgGrad)"/>

  <!-- Gold border -->
  <rect x="14" y="14" width="996" height="996" rx="185" ry="185" fill="none" stroke="url(#borderGrad)" stroke-width="14"/>

  <!-- Inner subtle border -->
  <rect x="28" y="28" width="968" height="968" rx="172" ry="172" fill="none" stroke="#c8860a" stroke-width="2" opacity="0.3"/>

  <!-- SCB text -->
  <text
    x="512"
    y="490"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="360"
    font-weight="900"
    fill="url(#scbGrad)"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="-10"
    filter="url(#glow)"
  >SCB</text>

  <!-- LIGHT text -->
  <text
    x="512"
    y="720"
    font-family="Arial, Helvetica, sans-serif"
    font-size="120"
    font-weight="300"
    fill="#c8c8c8"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="28"
  >LIGHT</text>
</svg>
